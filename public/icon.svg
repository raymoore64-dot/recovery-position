<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Badge: soft crescent-moon disc, night-shift nod -->
  <defs>
    <clipPath id="discClip">
      <circle cx="120" cy="120" r="108"/>
    </clipPath>
  </defs>

  <circle cx="120" cy="120" r="108" fill="#1E2A47"/>
  <!-- crescent cut-out, subtle -->
  <circle cx="150" cy="96" r="94" fill="#24304F" clip-path="url(#discClip)"/>

  <!-- ground line, grounds the resting pose -->
  <line x1="58" y1="176" x2="182" y2="176" stroke="#3A4568" stroke-width="6" stroke-linecap="round"/>

  <!-- Recovery-position figure, single-weight rounded line art, amber -->
  <g fill="none" stroke="#F3A468" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- torso, head resting low to the ground -->
    <path d="M 90 128 L 138 152"/>
    <!-- supporting arm, bent, cheek resting on hand -->
    <path d="M 96 140 L 84 152 L 82 168"/>
    <!-- far arm resting across front -->
    <path d="M 120 143 L 142 132"/>
    <!-- bent top leg, knee drawn up -->
    <path d="M 138 152 L 160 144 L 176 160"/>
    <!-- straight bottom leg -->
    <path d="M 138 152 L 170 172"/>
  </g>
  <!-- head -->
  <circle cx="76" cy="122" r="18" fill="#F3A468"/>

  <!-- small crescent moon accent, upper right -->
  <path d="M 172 56 a 15 15 0 1 0 3 29 a 11 11 0 1 1 -3 -29 Z" fill="#F3A468"/>
</svg>
